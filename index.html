    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-editor: #1e293b;
            --bg-preview: #f8fafc;
            --bg-toolbar: #0f172a;
            --text-editor: #e2e8f0;
            --text-preview: #1e293b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --font-editor: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            --font-preview: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius: 10px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-preview);
            background: #0f172a;
        }

        /* ── TOOLBAR ── */
        .toolbar {
            height: 50px;
            background: var(--bg-toolbar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #1e293b;
            z-index: 100;
            position: relative;
        }

        .toolbar-left { display: flex; align-items: center; gap: 10px; }

        .app-logo {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800; color: white;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .app-title {
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .app-title span.accent { color: var(--accent); }
        .app-title span.sub { color: #475569; font-weight: 400; font-size: 12px; margin-left: 2px; }

        .toolbar-actions { display: flex; align-items: center; gap: 6px; }

        .btn {
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.15);
            color: #a5b4fc;
            padding: 6px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            font-family: var(--font-preview);
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 6px;
        }

        .btn:hover {
            background: rgba(99,102,241,0.18);
            border-color: rgba(99,102,241,0.35);
            color: #c7d2fe;
            transform: translateY(-1px);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid rgba(148,163,184,0.12);
            color: #94a3b8;
            padding: 7px 9px;
            font-size: 15px;
        }

        .btn-icon:hover { background: rgba(148,163,184,0.1); color: #e2e8f0; border-color: rgba(148,163,184,0.25); }

        /* ── MAIN SPLIT LAYOUT ── */
        .main-container {
            height: calc(100% - 50px);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .editor-pane, .preview-pane {
            display: flex;
            flex-direction: column;
            min-width: 120px;
            overflow: hidden;
        }

        .editor-pane { background: var(--bg-editor); position: relative; flex: 1; }
        .preview-pane { background: var(--bg-preview); position: relative; flex: 1; }

        .pane-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 10px 18px 4px;
            color: #475569;
            flex-shrink: 0;
        }

        .editor-pane .pane-label { color: #64748b; }

        /* ── EDITOR ── */
        .editor-wrapper { flex: 1; position: relative; overflow: hidden; }

        #editor {
            width: 100%; height: 100%;
            background: transparent;
            border: none; outline: none;
            color: var(--text-editor);
            font-family: var(--font-editor);
            font-size: 14px;
            line-height: 1.75;
            padding: 8px 20px 36px;
            resize: none;
            tab-size: 4;
            caret-color: #a5b4fc;
        }

        #editor::placeholder { color: #3b4d6b; }
        #editor:focus { background: rgba(99,102,241,0.015); }

        /* ── SPLITTER ── */
        .splitter {
            width: 8px;
            cursor: col-resize;
            background: var(--bg-toolbar);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }

        .splitter-track {
            width: 4px; height: 56px;
            background: #334155;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .splitter:hover, .splitter.active { background: var(--accent); }
        .splitter:hover .splitter-track, .splitter.active .splitter-track {
            width: 5px; height: 64px;
            background: white;
            border-radius: 6px;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* ── PREVIEW CONTENT ── */
        .preview-scroll { flex: 1; overflow-y: auto; padding: 8px 24px 48px; }

        .preview-scroll::-webkit-scrollbar { width: 6px; }
        .preview-scroll::-webkit-scrollbar-track { background: transparent; }
        .preview-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .preview-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #preview, #previewFS {
            color: var(--text-preview);
            font-family: var(--font-preview);
            font-size: 15px;
            line-height: 1.8;
            max-width: 760px;
            margin: 0 auto;
        }

        #preview h1, #previewFS h1 {
            font-size: 2rem; font-weight: 800; margin: 0.9em 0 0.4em;
            color: #0f172a; letter-spacing: -0.5px; padding-bottom: 0.3em;
            border-bottom: 2px solid #e2e8f0;
        }
        #preview h2, #previewFS h2 {
            font-size: 1.55rem; font-weight: 700; margin: 1.1em 0 0.4em; color: #1e293b; letter-spacing: -0.3px;
        }
        #preview h3, #previewFS h3 { font-size: 1.25rem; font-weight: 600; margin: 0.8em 0 0.3em; color: #334155; }
        #preview h4, #previewFS h4 { font-size: 1.1rem; font-weight: 600; margin: 0.7em 0 0.3em; color: #475569; }

        #preview p, #previewFS p { margin: 0.6em 0; }
        #preview a, #previewFS a {
            color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        #preview a:hover, #previewFS a:hover { border-bottom-color: var(--accent); }

        #preview strong, #previewFS strong { font-weight: 700; color: #0f172a; }
        #preview em, #previewFS em { font-style: italic; }

        #preview code, #previewFS code {
            background: #f1f5f9; padding: 2px 7px; border-radius: 4px;
            font-family: var(--font-editor); font-size: 0.88em; color: #be185d;
        }

        #preview pre, #previewFS pre {
            background: #1e293b; color: #e2e8f0; padding: 16px 20px;
            border-radius: var(--radius); overflow-x: auto; margin: 1em 0;
        }

        #preview pre code, #previewFS pre code {
            background: transparent; color: inherit; padding: 0; font-size: 13.5px; line-height: 1.65;
        }

        #preview blockquote, #previewFS blockquote {
            border-left: 4px solid var(--accent); margin: 1em 0; padding: 0.6em 1em;
            background: rgba(99,102,241,0.05); border-radius: 0 var(--radius) var(--radius) 0; color: #475569;
        }

        #preview ul, #preview ol, #previewFS ul, #previewFS ol { padding-left: 1.8em; margin: 0.6em 0; }
        #preview li, #previewFS li { margin: 0.25em 0; }

        #preview img, #previewFS img { max-width: 100%; border-radius: var(--radius); margin: 0.5em 0; }

        #preview table, #previewFS table {
            width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 14px;
        }
        #preview th, #previewFS th { background: #f1f5f9; padding: 10px 14px; text-align: left; font-weight: 600; border: 1px solid #e2e8f0; }
        #preview td, #previewFS td { padding: 9px 14px; border: 1px solid #e2e8f0; }
        #preview tr:nth-child(even) td, #previewFS tr:nth-child(even) td { background: #fafbfd; }

        #preview hr, #previewFS hr {
            border: none; height: 2px; background: linear-gradient(to right, transparent, #cbd5e1, transparent); margin: 1.5em 0;
        }

        #preview input[type="checkbox"], #previewFS input[type="checkbox"] { accent-color: var(--accent); margin-right: 6px; }

        /* ── FULLSCREEN MODE ── */
        .main-container.fullscreen .editor-pane,
        .main-container.fullscreen .splitter { display: none !important; }

        .fullscreen-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 999;
            background: var(--bg-preview);
        }
        .fullscreen-overlay.visible { display: flex; flex-direction: column; }

        .fullscreen-toolbar {
            height: 50px; background: var(--bg-toolbar);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; flex-shrink: 0;
        }

        .fullscreen-close {
            width: 38px; height: 38px; background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15); color: #fca5a5;
            border-radius: 8px; cursor: pointer; font-size: 19px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; line-height: 1;
        }

        .fullscreen-close:hover { background: rgba(239,68,68,0.18); color: #ef4444; transform: scale(1.05); }

        /* ── STATUS BAR ── */
        .status-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 28px; background: rgba(15,23,42,0.95);
            backdrop-filter: blur(8px); display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px; font-size: 11px; color: #475569; z-index: 5;
        }

        .status-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; margin-right: 4px; vertical-align: middle; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .word-count-badge { background: rgba(99,102,241,0.1); color: #a5b4fc; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 11px; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 70px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b; color: #e2e8f0; padding: 10px 22px;
            border-radius: 10px; font-size: 13px; font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); border: 1px solid #334155;
            z-index: 10000; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .app-title-text { display: none; }
            .preview-scroll, #previewFS { padding-left: 12px !important; padding-right: 12px !important; }
            #editor { font-size: 13px; padding: 8px 10px 20px; }
            .toolbar { padding: 0 10px; gap: 4px; }
        }

        @media (max-width: 768px) {
            .btn span.btn-text { display: none; }
        }
    </style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
    <div class="toolbar-left">
        <div class="app-logo">M</div>
        <span class="app-title"><span class="accent">Mark</span><span class="sub">downLive — Éditeur temps réel</span></span>
    </div>
    <div class="toolbar-actions">
        <button class="btn" id="btnSample" title="Charger un exemple">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span class="btn-text">Exemple</span>
        </button>
        <button class="btn" id="btnCopyHTML" title="Copier le HTML généré">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="btn-text">Copier HTML</span>
        </button>
        <button class="btn" id="btnExport" title="Exporter en fichier HTML">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="btn-text">Export</span>
        </button>
        <div style="width:1px;height:24px;background:#1e293b;margin:0 4px;"></div>
        <button class="btn btn-icon" id="btnFullscreen" title="Plein écran (F11)">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
    </div>
</div>

<!-- MAIN SPLIT -->
<div class="main-container" id="mainContainer">
    <div class="editor-pane" id="editorPane">
        <div class="pane-label">📝 Markdown</div>
        <div class="editor-wrapper">
            <textarea id="editor" spellcheck="true" placeholder="Collez ou écrivez votre contenu Markdown ici...&#10;&#10;Essayez : collez un texte, utilisez les exemples ci-dessus, ou commencez à écrire."></textarea>
            <div class="status-bar">
                <div class="status-left"><span><span class="status-dot"></span>Prêt</span></div>
                <div class="status-right">
                    <span id="charCount">0 caractères</span>
                    <span class="word-count-badge" id="wordCount">0 mots</span>
                </div>
            </div>
        </div>
    </div>

    <div class="splitter" id="splitter"><div class="splitter-track"></div></div>

    <div class="preview-pane" id="previewPane">
        <div class="pane-label">👁️ Prévisualisation</div>
        <div class="preview-scroll" id="previewScroll">
            <div id="preview"></div>
        </div>
    </div>
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fullscreen-toolbar">
        <span style="color:#e2e8f0;font-size:13px;font-weight:600;">👁️ Prévisualisation Plein Écran</span>
        <button class="fullscreen-close" id="btnCloseFullscreen" title="Fermer (Échap)">✕</button>
    </div>
    <div class="preview-scroll" style="flex:1;" id="previewScrollFS">
        <div id="previewFS"></div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

<script>
(function() {
    'use strict';

    var editor = document.getElementById('editor');
    var preview = document.getElementById('preview');
    var previewFS = document.getElementById('previewFS');
    var charCount = document.getElementById('charCount');
    var wordCountEl = document.getElementById('wordCount');
    var mainContainer = document.getElementById('mainContainer');
    var splitter = document.getElementById('splitter');
    var fullscreenOverlay = document.getElementById('fullscreenOverlay');
    var toast = document.getElementById('toast');

    var sampleMarkdown = [
        '# Bienvenue dans Markdown Live ✨',
        '',
        'Un **éditeur Markdown** en temps réel avec prévisualisation instantanée. Collez ou écrivez votre contenu à gauche !',
        '',
        '## Fonctionnalités',
        '',
        '- 🎯 Prévisualisation en temps réel',
        '- ↔️ Panneau redimensionnable par glissement',
        '- 📺 Mode plein écran pour la prévisualisation',
        '- 💾 Export en fichier HTML',
        '- 📱 PWA — installable sur mobile et desktop',
        '- ⌨️ Support du copier-coller',
        '',
        '## Exemples de styles',
        '',
        '### Typographie',
        '',
        'Voici un texte avec du *style italique*, du **gras**, et du ***gras italique***. Vous pouvez aussi utiliser ~~barré~~.',
        '',
        '### Liens et images',
        '',
        'Visitez [GitHub](https://github.com) pour en savoir plus.',
        '',
        '> 💡 Le markdown est un langage de balisage léger, créé par John Gruber en 2004. Il permet d\'écrire du texte formaté avec une syntaxe simple.',
        '',
        '### Liste à puces',
        '',
        '1. Premier élément',
        '2. Deuxième élément',
        '3. Troisième élément',
        '   - Sous-élément A',
        '   - Sous-élément B',
        '',
        '### Tâches',
        '',
        '- [x] Créer l\'éditeur Markdown',
        '- [x] Ajouter la prévisualisation HTML',
        '- [x] Implémenter le panneau redimensionnable',
        '- [ ] Ajouter le thème sombre pour la preview',
        '- [ ] Support des équations LaTeX',
        '',
        '### Tableau',
        '',
        '| Fonctionnalité | Statut | Priorité |',
        '|---------------|--------|----------|',
        '| Éditeur Markdown | ✅ Fait | Haute |',
        '| Prévisualisation | ✅ Fait | Haute |',
        '| Panneau mobile | ✅ Fait | Moyenne |',
        '| Plein écran | ✅ Fait | Moyenne |',
        '| Export HTML | ✅ Fait | Basse |',
        '',
        '### Bloc de code',
        '',
        '```javascript',
        'function saluer(nom) {',
        '    return "Bonjour, " + nom + " ! 👋";',
        '}',
        '',
        'console.log(saluer("Monde"));',
        '// → Bonjour, Monde ! 👋',
        '```',
        '',
        '### Séparateur',
        '',
        '---',
        '',
        '*Merci d\'avoir essayé Markdown Live ! 🚀*',
        ''
    ].join('\n');

    function renderMarkdown(md) {
        if (typeof marked !== 'undefined') {
            marked.setOptions({ breaks: true, gfm: true });
            return marked.parse(md);
        }
        return '<p style="color:#64748b;">⚠️ Chargement de la bibliothèque markdown...</p>';
    }

    function updatePreview() {
        var md = editor.value;
        preview.innerHTML = renderMarkdown(md);
        previewFS.innerHTML = renderMarkdown(md);
        updateStats(md);
    }

    function updateStats(text) {
        var chars = text.length;
        var words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        charCount.textContent = chars + ' caractère' + (chars > 1 ? 's' : '');
        wordCountEl.textContent = words + ' mot' + (words !== 1 ? 's' : '');
    }

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2200);
    }

    var updateTimeout;
    editor.addEventListener('input', function() {
        clearTimeout(updateTimeout);
        updateTimeout = setTimeout(updatePreview, 80);
    });

    editor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            var start = editor.selectionStart;
            var end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = start + 4;
            updatePreview();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            exportHTML();
        }
    });

    // ── SPLITTER DRAG ──
    var isDragging = false;

    splitter.addEventListener('mousedown', startDrag);
    splitter.addEventListener('touchstart', startDrag, { passive: false });

    function startDrag(e) {
        e.preventDefault();
        isDragging = true;
        splitter.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';

        var onMove = function(ev) {
            if (!isDragging) return;
            var clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
            var containerRect = mainContainer.getBoundingClientRect();
            var newPercent = ((clientX - containerRect.left) / containerRect.width) * 100;
            newPercent = Math.max(15, Math.min(85, newPercent));

            document.getElementById('editorPane').style.flex = 'none';
            document.getElementById('editorPane').style.width = newPercent + '%';
        };

        var onEnd = function() {
            isDragging = false;
            splitter.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
    }

    // ── FULLSCREEN ──
    var isFullscreen = false;

    function enterFullscreen() {
        isFullscreen = true;
        mainContainer.classList.add('fullscreen');
        fullscreenOverlay.classList.add('visible');
        updatePreview();
        showToast('👁️ Plein écran — Échap pour quitter');
    }

    function exitFullscreen() {
        isFullscreen = false;
        mainContainer.classList.remove('fullscreen');
        fullscreenOverlay.classList.remove('visible');
        editor.focus();
    }

    document.getElementById('btnFullscreen').addEventListener('click', function() {
        if (isFullscreen) exitFullscreen();
        else enterFullscreen();
    });

    document.getElementById('btnCloseFullscreen').addEventListener('click', exitFullscreen);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isFullscreen) exitFullscreen();
    });

    // ── SAMPLE ──
    document.getElementById('btnSample').addEventListener('click', function() {
        editor.value = sampleMarkdown;
        updatePreview();
        showToast('📄 Exemple chargé !');
    });

    // ── COPY HTML ──
    document.getElementById('btnCopyHTML').addEventListener('click', function() {
        var htmlContent = preview.innerHTML;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(htmlContent).then(function() {
                showToast('✅ HTML copié !');
            }).catch(fallbackCopy);
        } else {
            fallbackCopy();
        }
        function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = htmlContent;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ HTML copié !');
        }
    });

    // ── EXPORT HTML ──
    function exportHTML() {
        var rendered = preview.innerHTML;
        var fullHTML = '<!DOCTYPE html>\n<html lang="fr">\n<head>\n';
        fullHTML += '<meta charset="UTF-8">\n';
        fullHTML += '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
        fullHTML += '<title>Markdown Export</title>\n';
        fullHTML += '<style>\n';
        fullHTML += '*{margin:0;padding:0;box-sizing:border-box}\n';
        fullHTML += 'body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#1e293b;line-height:1.8;padding:40px 20px;max-width:760px;margin:0 auto;font-size:15px}\n';
        fullHTML += 'h1{font-size:2rem;font-weight:800;margin:.9em 0 .4em;padding-bottom:.3em;border-bottom:2px solid #e2e8f0}\n';
        fullHTML += 'h2{font-size:1.55rem;font-weight:700;margin:1.1em 0 .4em}\n';
        fullHTML += 'h3{font-size:1.25rem;font-weight:600;margin:.8em 0 .3em}\n';
        fullHTML += 'p{margin:.6em 0}a{color:#6366f1;text-decoration:none}a:hover{text-decoration:underline}strong{font-weight:700}\n';
        fullHTML += "code{background:#f1f5f9;padding:2px 7px;border-radius:4px;font-family:'Fira Code',monospace;font-size:.88em;color:#be185d}\n";
        fullHTML += 'pre{background:#1e293b;color:#e2e8f0;padding:16px 20px;border-radius:10px;overflow-x:auto;margin:1em 0}\n';
        fullHTML += "pre code{background:none;color:inherit;padding:0;font-size:13.5px;line-height:1.65}\n";
        fullHTML += 'blockquote{border-left:4px solid #6366f1;margin:1em 0;padding:.6em 1em;background:rgba(99,102,241,.05);border-radius:0 10px 10px 0;color:#475569}\n';
        fullHTML += "ul,ol{padding-left:1.8em;margin:.6em 0}li{margin:.25em 0}img{max-width:100%;border-radius:10px}\n";
        fullHTML += 'table{width:100%;border-collapse:collapse;margin:1em 0}th{background:#f1f5f9;padding:10px 14px;text-align:left;font-weight:600;border:1px solid #e2e8f0}\n';
        fullHTML += 'td{padding:9px 14px;border:1px solid #e2e8f0}tr:nth-child(even) td{background:#fafbfd}hr{border:none;height:2px;background:linear-gradient(to right,transparent,#cbd5e1,transparent);margin:1.5em 0}\n';
        fullHTML += 'input[type=checkbox]{accent-color:#6366f1;margin-right:6px}\n';
        fullHTML += '@media(max-width:600px){body{padding:20px 14px}}\n';
        fullHTML += '</style>\n</head>\n<body>\n';
        fullHTML += rendered + '\n</body>\n</html>';

        var blob = new Blob([fullHTML], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'markdown-export.html';
        a.click();
        URL.revokeObjectURL(url);
        showToast('📥 Fichier HTML exporté !');
    }

    document.getElementById('btnExport').addEventListener('click', exportHTML);

    // ── PWA MANIFEST (clean data URI) ──
    var manifestEl = document.getElementById('manifest-link');
    if (manifestEl) {
        try {
            var manifestJSON = JSON.stringify({
                name: 'Markdown Live Preview',
                short_name: 'MDLive',
                start_url: '.',
                display: 'standalone',
                background_color: '#0f172a',
                theme_color: '#0f172a',
                icons: [{
                    src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#6366f1"/><text x="96" y="135" text-anchor="middle" font-size="120" font-weight="bold" fill="white">M</text></svg>'),
                    sizes: '192x192',
                    type: 'image/svg+xml'
                }]
            });
            manifestEl.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(manifestJSON);
        } catch (e) {
            console.warn('Manifest error:', e);
        }
    }

    // ── PWA SERVICE WORKER (safe registration) ──
    if ('serviceWorker' in navigator) {
        try {
            var swURL = URL.createObjectURL(
                new Blob([
                    "var CACHE='ml-v1';",
                    "self.addEventListener('install',function(e){self.skipWaiting()});",
                    "self.addEventListener('activate',function(e){e.waitUntil(clients.claim())});",
                    "self.addEventListener('fetch',function(e){})"
                ], { type: 'application/javascript' })
            );
            navigator.serviceWorker.register(swURL).catch(function(){});
        } catch (e) {
            console.warn('SW registration skipped');
        }
    }

    // ── INIT ──
    editor.value = sampleMarkdown;
    updatePreview();

})();
</script>
</body>
</html>
